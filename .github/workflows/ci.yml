name: CI

# Site-only changes (site/, its Pages workflow) do not touch the app, so they skip the macOS build.
on:
  push:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache SwiftPM build products
        uses: actions/cache@v4
        with:
          path: |
            PlopcutCore/.build
            PlopcutApp/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('PlopcutCore/Package.swift', 'PlopcutApp/Package.swift', 'PlopcutCore/**/*.swift', 'PlopcutApp/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Print toolchain
        run: swift --version

      - name: Build PlopcutCore
        working-directory: PlopcutCore
        run: swift build

      - name: Test PlopcutCore
        working-directory: PlopcutCore
        run: swift test

      - name: Build PlopcutApp
        working-directory: PlopcutApp
        run: swift build

      - name: Test PlopcutApp
        working-directory: PlopcutApp
        run: swift test

      - name: Build app bundle
        run: sh scripts/make-app.sh debug
